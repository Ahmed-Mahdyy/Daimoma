name: CI & Production Build Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-kit:
    name: Spec Kit Artifact Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .devin/scripts/specs.py check
      - run: python3 -m unittest discover -s ".devin/scripts" -p "test_*.py" -v

  backend:
    name: Backend Lint, Migrations & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daimoma
          POSTGRES_USER: daimoma
          POSTGRES_PASSWORD: daimoma_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-ephemeral-secret-key-not-used-in-production-50chars
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://daimoma:daimoma_ci_password@localhost:5432/daimoma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint & format check
        working-directory: backend
        run: ruff check .
      - name: Check pending migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run pytest suite
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend Typecheck, Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript & ESLint
        working-directory: frontend
        run: |
          npx tsc -b
          npx eslint .
      - name: Vitest unit suite
        working-directory: frontend
        run: npx vitest run
      - name: Production SPA build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Production Multi-Stage Docker Build
    needs: [spec-kit, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend & web images (no secrets baked in)
        run: |
          docker build -f deployment/Dockerfile --target backend -t daimoma-backend:ci .
          docker build -f deployment/Dockerfile --target web -t daimoma-web:ci .
