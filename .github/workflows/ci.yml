name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret
  DJANGO_SETTINGS_MODULE: config.settings.test
  DATABASE_URL: postgres://daimoma:daimoma_ci_password@localhost:5432/daimoma_test

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daimoma_test
          POSTGRES_USER: daimoma
          POSTGRES_PASSWORD: daimoma_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daimoma -d daimoma_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL-backed)
        working-directory: backend
        run: python -m pytest -q
      - name: OpenAPI schema generates without warnings
        working-directory: backend
        run: python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Vitest
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build

  schema-drift:
    # Regenerating frontend/src/api/schema.d.ts from the live schema must
    # produce a zero diff — the typed client must never lag the API.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daimoma_test
          POSTGRES_USER: daimoma
          POSTGRES_PASSWORD: daimoma_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daimoma -d daimoma_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: python manage.py spectacular --file /tmp/schema.yml
      - working-directory: frontend
        run: npm ci
      - name: Regenerate types and compare
        working-directory: frontend
        run: |
          npx openapi-typescript /tmp/schema.yml -o /tmp/schema.d.ts
          diff -u src/api/schema.d.ts /tmp/schema.d.ts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.88.2
        with:
          extra_args: --only-verified
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
