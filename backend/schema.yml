openapi: 3.0.3
info:
  title: Daimoma API
  version: 0.1.0
paths:
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      description: |-
        GET /api/v1/audit-events/ — paginated, scoped audit history.

        HR: all organization events. Managers: events affecting current direct
        reports only. Employees: 403. Append-only — no detail/patch/delete.
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAuditEvents'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        GET /api/v1/auth/csrf/ — sets the csrftoken cookie so the SPA can send
        the X-CSRFToken header on unsafe requests. Returns no personal data.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: |-
        POST /api/v1/auth/invitations/accept/ — single-use 48h token + new
        password. Replay, expiry, and policy violations all rejected.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        POST /api/v1/auth/login/ — email/password. Explicitly CSRF-protected
        even for anonymous callers; bounded failures; generic error.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - csrfCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/v1/auth/logout/ — ends the current session only.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        POST /api/v1/auth/password-reset/ — generic acknowledgement; never
        reveals whether the email maps to an account.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        POST /api/v1/auth/password-reset/confirm/ — 30-min single-use token;
        on success all existing sessions are invalidated.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/choices/managers/:
    get:
      operationId: choices_managers_retrieve
      description: |-
        GET /api/v1/choices/managers/ — HR-only scoped options for the
        reporting-line field: active profiles inside the caller's organization.
        Never exposes global user lists.
      tags:
      - choices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerChoices'
          description: ''
  /api/v1/dashboards/organization/:
    get:
      operationId: dashboards_organization_retrieve
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive local start date
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive local end date
      tags:
      - dashboards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/dashboards/personal/:
    get:
      operationId: dashboards_personal_retrieve
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive local start date
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive local end date
      tags:
      - dashboards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/dashboards/team/:
    get:
      operationId: dashboards_team_retrieve
      description: |-
        Manager: current direct reports. HR: organization-wide (their whole
        'team').
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive local start date
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive local end date
      tags:
      - dashboards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/departments/:
    get:
      operationId: departments_list
      tags:
      - departments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDepartments'
          description: ''
    post:
      operationId: departments_create
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Department'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: departments_retrieve
      description: PATCH only — departments are deactivated, never deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - departments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    patch:
      operationId: departments_partial_update
      description: PATCH only — departments are deactivated, never deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartment'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/employees/:
    get:
      operationId: employees_list
      description: |-
        GET — scoped directory: employee sees self, manager sees current
        direct reports, HR sees the organization (no general directory).
        POST — HR provisioning only.
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEmployees'
          description: ''
    post:
      operationId: employees_create
      description: |-
        GET — scoped directory: employee sees self, manager sees current
        direct reports, HR sees the organization (no general directory).
        POST — HR provisioning only.
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeProvision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeProvision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeProvision'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSummary'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: employees_retrieve
      description: |-
        GET — same scoped-visibility rules as the list; out-of-scope ids are
        404 (non-enumerating). PATCH — HR only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSummary'
          description: ''
    patch:
      operationId: employees_partial_update
      description: |-
        GET — same scoped-visibility rules as the list; out-of-scope ids are
        404 (non-enumerating). PATCH — HR only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSummary'
          description: ''
  /api/v1/employees/{id}/deactivate/:
    post:
      operationId: employees_deactivate_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reason'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDetailResponse'
          description: ''
  /api/v1/employees/{id}/photo/:
    get:
      operationId: employees_photo_retrieve
      description: Returns photo bytes; 404 when out of scope or unset.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/employees/{id}/reactivate/:
    post:
      operationId: employees_reactivate_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reason'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDetailResponse'
          description: ''
  /api/v1/employees/{id}/resend-invitation/:
    post:
      operationId: employees_resend_invitation_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDetailResponse'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: |-
        GET /api/v1/me/ — own profile summary.
        PATCH /api/v1/me/ — allowlisted self-service fields only.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: |-
        GET /api/v1/me/ — own profile summary.
        PATCH /api/v1/me/ — allowlisted self-service fields only.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/password/:
    post:
      operationId: me_password_create
      description: |-
        POST /api/v1/me/password/ — requires the current password; ends all
        other sessions while keeping the caller's session alive.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/me/photo/:
    get:
      operationId: me_photo_retrieve
      description: Returns the photo bytes (image/png, image/jpeg or image/webp).
        404 when no photo is set.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
    post:
      operationId: me_photo_create
      description: |-
        GET /api/v1/me/photo/ — stream the caller's profile photo (auth-gated;
        private media is never served as an open static file).
        POST /api/v1/me/photo/ — multipart upload; PNG/JPEG/WebP up to 2 MiB.
        DELETE /api/v1/me/photo/ — remove the current photo.
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
              required:
              - photo
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: me_photo_destroy
      description: |-
        GET /api/v1/me/photo/ — stream the caller's profile photo (auth-gated;
        private media is never served as an open static file).
        POST /api/v1/me/photo/ — multipart upload; PNG/JPEG/WebP up to 2 MiB.
        DELETE /api/v1/me/photo/ — remove the current photo.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      description: |-
        GET /api/v1/notifications/ — recipient-only, paginated (50/page),
        `?unread=true` and `?kind=` filters; the envelope always carries
        `unread_count` for the bell.
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotifications'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: notifications_read_create
      description: |-
        POST /api/v1/notifications/{id}/read/ — recipient-only; others' ids
        are 404 (non-enumerating). Idempotent.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/{id}/target/:
    get:
      operationId: notifications_target_retrieve
      description: |-
        GET /api/v1/notifications/{id}/target/ — resolve the stored target to
        a frontend path, rechecked against CURRENT authorization. Inaccessible
        or stale targets are indistinguishable 404s.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTarget'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      description: |-
        POST /api/v1/notifications/read-all/ — marks every unread row for the
        caller; never touches other recipients.
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDetail'
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: notifications_unread_count_retrieve
      description: |-
        GET /api/v1/notifications/unread-count/ — the 60s badge-poll
        endpoint (D-009); intentionally cheap.
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/v1/organization/settings/:
    get:
      operationId: organization_settings_retrieve
      tags:
      - organization
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
          description: ''
    patch:
      operationId: organization_settings_partial_update
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrgSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrgSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrgSettings'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
          description: ''
  /api/v1/reports/requests/:
    get:
      operationId: reports_requests_retrieve
      description: |-
        GET reports/requests/ — scoped submitted requests (drafts excluded),
        date basis = submitted_at (D-009).
      parameters:
      - in: query
        name: employee
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive local start date
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive local end date
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/reports/requests/export/:
    get:
      operationId: reports_requests_export_retrieve
      description: GET reports/requests/export/ — manager/HR bounded CSV (D-009).
      parameters:
      - in: query
        name: employee
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive local start date
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive local end date
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reports/working-hours/:
    get:
      operationId: reports_working_hours_retrieve
      description: |-
        GET reports/working-hours/ — scoped employee x work_date minutes.
        `status` selects the sheet's CURRENT status (default approved).
      parameters:
      - in: query
        name: employee
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive local start date
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive local end date
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/reports/working-hours/export/:
    get:
      operationId: reports_working_hours_export_retrieve
      description: GET reports/working-hours/export/ — manager/HR bounded CSV (D-009).
      parameters:
      - in: query
        name: employee
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive local start date
      - in: query
        name: ordering
        schema:
          type: string
