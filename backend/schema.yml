components:
  schemas:
    ApprovalStep:
      type: object
      properties:
        cycle:
          type: integer
          maximum: 2147483647
          minimum: 0
        sequence:
          type: integer
          maximum: 32767
          minimum: 0
        required_role:
          $ref: '#/components/schemas/RequiredRoleEnum'
        reviewer:
          type: string
          format: uuid
          nullable: true
        reviewer_name:
          type: string
          readOnly: true
        reviewer_email:
          type: string
          format: email
          readOnly: true
        status:
          $ref: '#/components/schemas/ApprovalStepStatusEnum'
        reason:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
      required:
      - cycle
      - required_role
      - reviewer_email
      - reviewer_name
      - sequence
    ApprovalStepStatusEnum:
      enum:
      - waiting
      - pending
      - approved
      - rejected
      - returned
      type: string
      description: |-
        * `waiting` - Waiting
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `returned` - Returned
    AuditEvent:
      type: object
      description: |-
        Read-only safe audit shape: no actor internals, no secrets (metadata
        is already redacted at write time).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          maxLength: 80
        actor_email:
          type: string
          format: email
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        target_type:
          type: string
          maxLength: 80
        target_id:
          type: string
          format: uuid
        metadata: {}
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - actor_name
      - id
      - occurred_at
      - target_id
      - target_type
    CategoryEnum:
      enum:
      - leave
      - equipment
      - hr_service
      - work_from_home
      - early_leave
      - general
      type: string
      description: |-
        * `leave` - Leave
        * `equipment` - Equipment
        * `hr_service` - HR service
        * `work_from_home` - Work from home
        * `early_leave` - Early leave
        * `general` - General
    Dashboard:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/DashboardPeriod'
        scope:
          type: string
        requests:
          type: object
          additionalProperties: {}
        timesheets:
          type: object
          additionalProperties: {}
        approved_minutes:
          type: integer
        pending_review:
          type: integer
      required:
      - approved_minutes
      - pending_review
      - period
      - requests
      - scope
      - timesheets
    DashboardPeriod:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
      required:
      - from
      - timezone
      - to
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
      required:
      - id
      - name
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmployeeProvision:
      type: object
      description: |-
        HR provisioning input — organization and privileges are assigned
        server-side; the allowlist contains no is_staff/is_superuser/password.
      properties:
        email:
          type: string
          format: email
        employee_code:
          type: string
          maxLength: 40
        display_name:
          type: string
          default: ''
          maxLength: 150
        phone:
          type: string
          default: ''
          maxLength: 40
        job_title:
          type: string
          default: ''
          maxLength: 150
        preferred_locale:
          allOf:
          - $ref: '#/components/schemas/PreferredLocaleEnum'
          default: en
        department:
          type: string
          format: uuid
          nullable: true
        manager:
          type: string
          format: uuid
          nullable: true
        roles:
          type: array
          items:
            type: string
      required:
      - email
      - employee_code
    EmployeeRequest:
      type: object
      description: |-
        Read shape for scoped lists/details — organization, owner, status and
        workflow fields are server-owned and never writable through this API.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee:
          type: string
          format: uuid
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        employee_email:
          type: string
          format: email
          readOnly: true
        employee_code:
          type: string
          readOnly: true
        type:
          type: string
          format: uuid
          readOnly: true
        type_name:
          type: string
          readOnly: true
        type_category:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        start_time:
          type: string
          format: time
          readOnly: true
          nullable: true
        end_time:
          type: string
          format: time
          readOnly: true
          nullable: true
        equipment_item:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/EmployeeRequestStatusEnum'
          readOnly: true
        cycle:
