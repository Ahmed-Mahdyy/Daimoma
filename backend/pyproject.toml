[project]
name = "daimoma-backend"
version = "0.1.0"
description = "Daimoma employee operations platform — Django/DRF backend"
requires-python = ">=3.12,<3.13"
readme = "README.md"

# Runtime and dev dependencies are pinned in requirements.txt / requirements-dev.txt.
# Keep exact versions; never float ranges.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "config", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DJ"]
ignore = ["S101"]  # assert is expected in tests

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "I001", "DJ012", "S"]
"**/tests/**" = ["S105", "S106"]
"**/conftest.py" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps", "tests"]
addopts = "--strict-markers --strict-config"
