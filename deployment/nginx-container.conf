server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Preserve upstream scheme/request-id from the Ubuntu host Nginx proxy.
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }

    # Docker embedded DNS so the backend hostname re-resolves after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API, liveness, and readiness routes proxy to Gunicorn; never fall back to SPA index.html.
    location ~ ^/(api|health|readyz)(/|$) {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Private media is served only through authenticated Django API views (/api/v1/me/photo/, etc.).
    location ^~ /media/ {
        return 404;
    }

    # collectstatic output shared from the migrate release step (Swagger UI, etc.).
    location ^~ /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed Vite assets can be cached long-term.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA route fallback for client-side navigation only.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
